<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Tango FC video room — match highlights, tactical logs and celebration reels.">
    <link rel="icon" type="image/jpeg" href="images/tangoforces.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos — Tango Football Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/videos.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <main-header></main-header>
    <mobile-nav></mobile-nav>

    <main>
        <section class="gallery-header">
            <h2>Club Video Room</h2>
            <p>Match highlights, matchday tactical logs, and celebration reels from Tango FC</p>
        </section>

        <section class="video-filters" id="videoFilters">
            <!-- Filter buttons will be dynamically generated here -->
        </section>

        <section class="gallery-container" id="videoContainer">
            <!-- Video sections and cards will be dynamically loaded here -->
        </section>
    </main>

    <div id="lightbox" class="lightbox">
        <div class="lightbox-content-wrapper">
            <span class="close-btn" onclick="closeLightbox()">✖</span>
            <video id="lightboxVideo" controls controlsList="nodownload"></video>
        </div>
    </div>

    <main-footer></main-footer>

    <script src="js/app-config.js"></script>
    <script src="js/cache-service.js"></script>
    <script src="js/components.js"></script>
    <script src="js/videos.js"></script>

    <script>
        // Emergency Force-Load for Header
        setTimeout(() => {
            const headerTag = document.querySelector('main-header');
            if (headerTag && headerTag.innerHTML.trim() === '') {
                if (typeof loadComponent === 'function') {
                    loadComponent("main-header", "header.html");
                }
            }
        }, 3000);
    </script>
</body>
</html>
