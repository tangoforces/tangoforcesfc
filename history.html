<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club History & Achievements — Tango Football Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/history.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <main-header></main-header>
    <mobile-nav></mobile-nav>

     <main>
         <section class="history-header">
             <h2>Club History & Achievements</h2>
         </section>
 
         <section id="clubInfo"></section>
 
         <section class="season-stats">
             <h3>2025/26 Season Statistics</h3>
             <div id="seasonStatsContainer"></div>
         </section>
 
         <section class="club-philosophy">
             <h3>Club Philosophy & Values</h3>
             <div id="philosophyContainer"></div>
         </section>
 
         <section class="achievements-section">
             <h3>Major Achievements</h3>
             <div class="achievements-container" id="achievementsContainer"></div>
         </section>
 
         <section class="milestones-section">
             <h3>Key Milestones</h3>
             <div class="timeline" id="timelineContainer"></div>
         </section>
     </main>
 
     <main-footer></main-footer>

    <script src="js/app-config.js"></script>
    <script src="js/cache-service.js"></script>
    <script src="js/components.js"></script>
    <script src="js/history.js"></script>

    <script>
        // Emergency Force-Load for Header
        setTimeout(() => {
            const headerTag = document.querySelector('main-header');
            if (headerTag && headerTag.innerHTML.trim() === '') {
                if (typeof loadComponent === 'function') {
                    loadComponent("main-header", "header.html");
                }
            }
        }, 3000);
    </script>
</body>
</html>
