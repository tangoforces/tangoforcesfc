<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Tango FC photo gallery — matchday action, trophy celebrations and behind-the-scenes moments.">
    <link rel="icon" type="image/jpeg" href="images/tangoforces.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery — Tango Football Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/gallery.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <main-header></main-header>
    <mobile-nav></mobile-nav>

    <main>
        <section class="page-hero">
            <h2>Photo Gallery</h2>
            <p>Capturing intense matchday action, trophy celebrations, and behind-the-scenes moments</p>
        </section>

        <div class="gallery-filters" id="galleryFilters">
            <button class="active" onclick="filterGallery('all')">All Photos</button>
            <button onclick="filterGallery('newseason')">2026 Season</button>
            <button onclick="filterGallery('matchday')">Matchday</button>
            <button onclick="filterGallery('champions')">Champions</button>
        </div>

        <div class="gallery-container" id="galleryContainer">
            <section class="subsection" id="sect-newseason">
                <h3>2026 Season</h3>
                <div class="gallery-grid" id="newseasonPicturesGrid">
                </div>
            </section>
            <section class="subsection" id="sect-matchday">
                <h3>Matchday</h3>
                <div class="gallery-grid" id="matchdayPicturesGrid">
                </div>
            </section>
            <section class="subsection" id="sect-champions">
                <h3>Champions</h3>
                <div class="gallery-grid" id="celebrationsPicturesGrid">
                </div>
            </section>
        </div>
    </main>

    <div id="lightbox" class="lightbox">
        <div class="lightbox-content-container">
            <span class="close-btn" onclick="closeLightbox()">✖</span>
            <button class="lightbox-nav-btn prev-btn" onclick="changeImage(-1)">
                <i class="fa-solid fa-chevron-left"></i>
            </button>
            <img id="lightboxImage" src="" alt="Enlarged View">
            <button class="lightbox-nav-btn next-btn" onclick="changeImage(1)">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>
    </div>

    <main-footer></main-footer>

    <script src="js/app-config.js"></script>
    <script src="js/cache-service.js"></script>
    <script src="js/components.js"></script>
    <script src="js/gallery.js"></script>

    <script>
        // Emergency Force-Load for Header
        setTimeout(() => {
            const headerTag = document.querySelector('main-header');
            if (headerTag && headerTag.innerHTML.trim() === '') {
                if (typeof loadComponent === 'function') {
                    loadComponent("main-header", "header.html");
                }
            }
        }, 3000);
    </script>
</body>
</html>
