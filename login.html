<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Tango FC</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="login-bg">
        <div class="login-bg-glow glow-1"></div>
        <div class="login-bg-glow glow-2"></div>
    </div>

    <div class="login-card">
        <a href="index.html" class="login-close-btn" aria-label="Cancel login">
            <i class="fa-solid fa-xmark"></i>
        </a>

        <div class="login-brand">
            <div class="login-logo-wrap">
                <img src="images/tangoforces.jpg" alt="Tango FC Logo">
            </div>
            <h1>Tango FC</h1>
            <p>Admin Portal</p>
        </div>

        <form id="login-form" autocomplete="off">
            <div id="login-error" class="error-msg" aria-live="polite"></div>
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input
                        type="text"
                        id="username"
                        placeholder="Enter username"
                        required
                        autocomplete="username"
                    >
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password"
                    >
                    <button type="button" class="toggle-pw" id="togglePw" tabindex="-1" aria-label="Show password">
                        <i class="fa-solid fa-eye" id="togglePwIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span id="btnText">Sign In</span>
                <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
            </button>

        </form>

        <p class="login-footer-note">
            <i class="fa-solid fa-shield-halved"></i>
            Authorised personnel only
        </p>

    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <!-- Your unique Firebase configuration -->
    <script src="js/firebase-init.js"></script>

    <!-- Load base data and main app logic for auth checking -->
    <script src="js/players-data.js"></script>
    <script src="js/admin.js"></script>
    <!-- The new login script -->
    <script src="js/login.js"></script>

</body>
</html>
