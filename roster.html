<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Meet the Tango FC squad — player profiles, positions, stats and bios for the 2026 season.">
    <link rel="icon" type="image/jpeg" href="images/tangoforces.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Player Roster — Tango Football Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/roster.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <main-header></main-header>
    <mobile-nav></mobile-nav>

    <main>

        <!-- ============================
             PAGE HERO
        ============================= -->
        <section class="roster-hero">
            <div class="roster-hero-content">
                <div class="season-badge">
                    <i class="fa-solid fa-users"></i>
                    2026 Season 
                </div>
                <h2>Player <span class="accent">Roster</span></h2>
                <p>Meet the champions of Tango FC — where talent meets determination</p>
            </div>

            <!-- Squad breakdown bar -->
            <div class="squad-stats">
                <div class="sq-item">
                    <strong id="sq-total">—</strong>
                    <span>Players</span>
                </div>
                <div class="sq-divider"></div>
                <div class="sq-item">
                    <strong id="sq-forwards" class="clr-red">—</strong>
                    <span>Forwards</span>
                </div>
                <div class="sq-divider"></div>
                <div class="sq-item">
                    <strong id="sq-midfielders" class="clr-blue">—</strong>
                    <span>Midfielders</span>
                </div>
                <div class="sq-divider"></div>
                <div class="sq-item">
                    <strong id="sq-defenders" class="clr-green">—</strong>
                    <span>Defenders</span>
                </div>
                <div class="sq-divider"></div>
                <div class="sq-item">
                    <strong id="sq-goalkeepers" class="clr-gold">—</strong>
                    <span>Goalkeepers</span>
                </div>
            </div>
        </section>

        <!-- ============================
             FILTER BAR
        ============================= -->
        <section class="roster-filter-bar">
            <div class="roster-filter-inner">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-position="all">
                        <i class="fa-solid fa-users"></i> All Players
                    </button>
                    <button class="filter-tab" data-position="Forward">
                        <i class="fa-solid fa-bolt"></i> Forwards
                    </button>
                    <button class="filter-tab" data-position="Midfielder">
                        <i class="fa-solid fa-crosshairs"></i> Midfielders
                    </button>
                    <button class="filter-tab" data-position="Defender">
                        <i class="fa-solid fa-shield-halved"></i> Defenders
                    </button>
                    <button class="filter-tab" data-position="Goalkeeper">
                        <i class="fa-solid fa-hands"></i> Goalkeepers
                    </button>
                </div>
            </div>
        </section>

        <!-- ============================
             PLAYERS GRID
        ============================= -->
        <section class="players-section">
            <div class="players-grid" id="rosterPlayers">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading squad…</p>
                </div>
            </div>
        </section>

        <!-- ============================
             CTA STRIP
        ============================= -->
        <section class="cta-strip">
            <div class="cta-content">
                <div>
                    <h3>Want to Join the Team?</h3>
                    <p>Experience the thrill of playing for Tango Football Club.</p>
                </div>
                <div class="cta-actions">
                    <a href="https://wa.me/263719246563?text=Hi%20Tango%20FC%2C%20I%27d%20like%20to%20join%20the%20team!"
                       target="_blank" rel="noopener noreferrer" class="btn-whatsapp">
                        <i class="fa-brands fa-whatsapp"></i> Chat on WhatsApp
                    </a>
                    <a href="matches.html" class="btn-secondary">
                        <i class="fa-solid fa-calendar-days"></i> View Fixtures
                    </a>
                </div>
            </div>
        </section>


    </main>

    <main-footer></main-footer>

    <script src="js/app-config.js"></script>
    <script src="js/cache-service.js"></script>
    <script src="js/components.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/players-data.js"></script>
    <script src="js/roster.js"></script>

    <script>
        // Emergency Force-Load for Header
        setTimeout(() => {
            const headerTag = document.querySelector('main-header');
            if (headerTag && headerTag.innerHTML.trim() === '') {
                if (typeof loadComponent === 'function') {
                    loadComponent("main-header", "header.html");
                }
            }
        }, 3000);
    </script>
</body>
</html>
