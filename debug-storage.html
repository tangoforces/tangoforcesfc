<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage Debug — Tango FC</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: #0a0e27; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { color: #00d4ff; margin-bottom: 20px; }
        .section { background: #1a1f3a; border: 1px solid #00d4ff; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .section h2 { color: #00d4ff; font-size: 16px; margin-bottom: 10px; border-bottom: 1px solid #00d4ff; padding-bottom: 10px; }
        .data-box { background: #0f1419; border: 1px solid #333; border-radius: 4px; padding: 15px; margin: 10px 0; max-height: 400px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; font-size: 12px; }
        .data-box.empty { color: #888; }
        .status { padding: 10px; border-radius: 4px; margin: 10px 0; font-weight: bold; }
        .status.success { background: #1a3a1a; color: #4caf50; border: 1px solid #4caf50; }
        .status.error { background: #3a1a1a; color: #f44336; border: 1px solid #f44336; }
        .status.info { background: #1a2a3a; color: #2196f3; border: 1px solid #2196f3; }
        button { background: #00d4ff; color: #000; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin: 5px; }
        button:hover { background: #00a8cc; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Storage Inspector — Tango FC</h1>
        
        <div class="section">
            <h2>⚡ Quick Actions</h2>
            <button onclick="refreshAll()">Refresh All</button>
            <button onclick="clearLocalStorage()">Clear localStorage</button>
            <button onclick="exportData()">Export as JSON</button>
        </div>

        <div class="section">
            <h2>📱 LocalStorage</h2>
            <div id="localStorage-status" class="status info">Loading...</div>
            <div id="localStorage-data" class="data-box empty">No data</div>
        </div>

        <div class="section">
            <h2>☁️ Firebase Firestore</h2>
            <div id="firebase-status" class="status info">Loading...</div>
            <div id="firebase-players" style="margin-top: 15px;">
                <h3>Players</h3>
                <div class="data-box empty">Loading...</div>
            </div>
            <div id="firebase-matches" style="margin-top: 15px;">
                <h3>Matches</h3>
                <div class="data-box empty">Loading...</div>
            </div>
            <div id="firebase-media" style="margin-top: 15px;">
                <h3>Media</h3>
                <div class="data-box empty">Loading...</div>
            </div>
            <div id="firebase-news" style="margin-top: 15px;">
                <h3>News</h3>
                <div class="data-box empty">Loading...</div>
            </div>
        </div>

        <div class="section">
            <h2>📊 Summary</h2>
            <div id="summary" class="data-box empty">Calculating...</div>
        </div>
    </div>

    <script src="js/firebase-init.js"></script>
    <script>
        async function loadFirebaseData() {
            if (!window.db) {
                document.getElementById('firebase-status').innerHTML = '<span class="status error">Firebase not initialized</span>';
                return {};
            }

            try {
                const collections = ['players', 'matches', 'media', 'news'];
                const data = {};

                for (let col of collections) {
                    const snapshot = await window.db.collection(col).get();
                    data[col] = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                }

                document.getElementById('firebase-status').innerHTML = '<span class="status success">✓ Connected to Firebase</span>';
                
                document.querySelector('#firebase-players .data-box').textContent = JSON.stringify(data.players, null, 2);
                document.querySelector('#firebase-matches .data-box').textContent = JSON.stringify(data.matches, null, 2);
                document.querySelector('#firebase-media .data-box').textContent = JSON.stringify(data.media, null, 2);
                document.querySelector('#firebase-news .data-box').textContent = JSON.stringify(data.news, null, 2);

                return data;
            } catch (err) {
                document.getElementById('firebase-status').innerHTML = `<span class="status error">✗ Firebase Error: ${err.message}</span>`;
                return {};
            }
        }

        function loadLocalStorage() {
            const storage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                try {
                    storage[key] = JSON.parse(localStorage.getItem(key));
                } catch (e) {
                    storage[key] = localStorage.getItem(key);
                }
            }

            if (Object.keys(storage).length === 0) {
                document.getElementById('localStorage-status').innerHTML = '<span class="status info">ℹ localStorage is empty</span>';
                document.getElementById('localStorage-data').textContent = '{}';
            } else {
                document.getElementById('localStorage-status').innerHTML = `<span class="status success">✓ ${Object.keys(storage).length} keys in localStorage</span>`;
                document.getElementById('localStorage-data').textContent = JSON.stringify(storage, null, 2);
            }

            return storage;
        }

        async function refreshAll() {
            document.querySelectorAll('.data-box').forEach(el => el.textContent = 'Loading...');
            const storage = loadLocalStorage();
            const firebase = await loadFirebaseData();
            generateSummary(storage, firebase);
        }

        function generateSummary(storage, firebase) {
            const summary = `
SUMMARY:
========

LocalStorage Keys: ${Object.keys(storage).length}
${Object.keys(storage).map(k => `  - ${k}: ${Array.isArray(storage[k]) ? `${storage[k].length} items` : typeof storage[k]}`).join('\n')}

Firebase Collections:
${['players', 'matches', 'media', 'news'].map(col => `  - ${col}: ${firebase[col]?.length || 0} documents`).join('\n')}

Data Source:
  Players: ${firebase.players?.length > 0 ? 'Firebase ✓' : 'localStorage ✓' || 'NOT FOUND ✗'}
  Matches: ${firebase.matches?.length > 0 ? 'Firebase ✓' : 'localStorage ✓' || 'NOT FOUND ✗'}
  Media: ${firebase.media?.length > 0 ? 'Firebase ✓' : (storage.adminMedia?.length > 0 ? 'localStorage ✓' : 'NOT FOUND ✗')}
  News: ${firebase.news?.length > 0 ? 'Firebase ✓' : 'localStorage ✓' || 'NOT FOUND ✗'}
            `;
            document.getElementById('summary').textContent = summary;
        }

        async function clearLocalStorage() {
            if (await confirm('Are you sure? This will clear all localStorage data.')) {
                localStorage.clear();
                refreshAll();
            }
        }

        function exportData() {
            const storage = {};
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                storage[key] = localStorage.getItem(key);
            }
            const blob = new Blob([JSON.stringify(storage, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tango-storage-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
        }

        // Load on page load
        document.addEventListener('DOMContentLoaded', refreshAll);
    </script>
</body>
</html>
