<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile — Tango Football Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/player-detail.css">
    <link rel="stylesheet" href="css/index.css">
</head>
<body>

    <main-header></main-header>
    <mobile-nav></mobile-nav>

    <main>
        <section class="detail-hero">
            <a href="roster.html" class="back-link">
                <i class="fa-solid fa-arrow-left"></i> Back to Roster
            </a>
        </section>

        <section class="detail-section" id="playerDetailRoot">
            <div class="loading-state">
                <div class="loading-spinner"></div>
                <p>Loading player profile…</p>
            </div>
        </section>
    </main>

    <main-footer></main-footer>

    <script src="js/components.js"></script>
    <script src="js/players-data.js"></script>
    <script src="js/player-detail.js"></script>

    <script>
        // Emergency Force-Load for Header
        setTimeout(() => {
            const headerTag = document.querySelector('main-header');
            if (headerTag && headerTag.innerHTML.trim() === '') {
                if (typeof loadComponent === 'function') {
                    loadComponent("main-header", "header.html");
                }
            }
        }, 3000);
    </script>
</body>
</html>
