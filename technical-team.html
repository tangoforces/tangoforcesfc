    <script>
        // Emergency Force-Load for Header
        setTimeout(() => {
            const headerTag = document.querySelector('main-header');
            if (headerTag && headerTag.innerHTML.trim() === '') {
                if (typeof loadComponent === 'function') {
                    loadComponent("main-header", "header.html");
                }
            }
        }, 3000);
    </script>
