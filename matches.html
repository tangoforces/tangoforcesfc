<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Tango FC fixtures and results — full match schedule, scores, goals and events for the 2026 season.">
    <link rel="icon" type="image/jpeg" href="images/tangoforces.jpg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Matches & Fixtures — Tango Football Club</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/matches.css">
</head>
<body>

    <main-header></main-header>
    <mobile-nav></mobile-nav>

    <main>

        <!-- ============================
             PAGE HERO
        ============================= -->
        <section class="matches-hero">
            <div class="matches-hero-content">
                <div class="season-badge">
                    <i class="fa-solid fa-trophy"></i>
                    Season 2026
                </div>
                <h2>Matches &amp; Fixtures</h2>
                <p>Full schedule, results and match events for Tango FC</p>
            </div>

            <!-- Quick season stats bar -->
            <div class="quick-stats">
                <div class="qs-item">
                    <strong id="qs-played">—</strong>
                    <span>Played</span>
                </div>
                <div class="qs-divider"></div>
                <div class="qs-item">
                    <strong id="qs-wins" class="clr-green">—</strong>
                    <span>Wins</span>
                </div>
                <div class="qs-divider"></div>
                <div class="qs-item">
                    <strong id="qs-draws" class="clr-gold">—</strong>
                    <span>Draws</span>
                </div>
                <div class="qs-divider"></div>
                <div class="qs-item">
                    <strong id="qs-losses" class="clr-red">—</strong>
                    <span>Losses</span>
                </div>
                <div class="qs-divider"></div>
                <div class="qs-item">
                    <strong id="qs-gf" class="clr-blue">—</strong>
                    <span>Goals For</span>
                </div>
                <div class="qs-divider"></div>
                <div class="qs-item">
                    <strong id="qs-upcoming">—</strong>
                    <span>Upcoming</span>
                </div>
            </div>
        </section>

        <!-- ============================
             FILTER BAR
        ============================= -->
        <section class="filter-bar">
            <div class="filter-inner">
                <div class="filter-tabs">
                    <button class="filter-tab active" data-filter="all">
                        <i class="fa-solid fa-list"></i> All Matches
                    </button>
                    <button class="filter-tab" data-filter="upcoming">
                        <i class="fa-solid fa-calendar-days"></i> Upcoming
                    </button>
                    <button class="filter-tab" data-filter="completed">
                        <i class="fa-solid fa-flag-checkered"></i> Results
                    </button>
                </div>
                <button class="refresh-btn" id="refreshMatches" title="Refresh matches">
                    <i class="fa-solid fa-arrows-rotate"></i>
                </button>
            </div>
        </section>

        <!-- ============================
             MATCHES GRID
        ============================= -->
        <section class="matches-section">
            <div class="matches-container" id="matchesContainer">
                <div class="loading-state">
                    <div class="loading-spinner"></div>
                    <p>Loading matches…</p>
                </div>
            </div>
        </section>

    </main>

    <main-footer></main-footer>

    <script src="js/app-config.js"></script>
    <script src="js/cache-service.js"></script>
    <script src="js/components.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/firebase-init.js"></script>
    <script src="js/matches.js"></script>

    <script>
        // Emergency Force-Load for Header
        setTimeout(() => {
            const headerTag = document.querySelector('main-header');
            if (headerTag && headerTag.innerHTML.trim() === '') {
                if (typeof loadComponent === 'function') {
                    loadComponent("main-header", "header.html");
                }
            }
        }, 3000);
    </script>
</body>
</html>
